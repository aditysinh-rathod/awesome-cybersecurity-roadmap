site_name: Awesome Cybersecurity Roadmap
site_description: Learn Cybersecurity from Beginner to Advanced with Roadmaps, Labs, Projects, and Hands-on Labs.
site_author: Aditysinh Rathod
site_url: https://aditysinh-rathod.github.io/awesome-cybersecurity-roadmap/

repo_name: aditysinh-rathod/awesome-cybersecurity-roadmap
repo_url: https://github.com/aditysinh-rathod/awesome-cybersecurity-roadmap
edit_uri: edit/main/docs/

copyright: Copyright © 2026 Aditysinh Rathod

theme:
  name: material
  language: en

  logo: assets/logo.png
  favicon: assets/favicon.png

  font:
    text: Inter
    code: JetBrains Mono

  palette:

    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.path

    - search.highlight
    - search.share
    - search.suggest

    - toc.follow
    - toc.integrate

    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr

  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aditysinh-rathod

nav:

  - 🏠 Home: index.md

  - 🚀 Getting Started:
      - Introduction: getting-started.md

  - 🐧 Linux:
      - Overview: linux/index.md
      - Linux Basics: linux/linux-basics.md
      - File System: linux/file-system.md
      - Permissions: linux/permissions.md
      - Bash Scripting: linux/bash.md
      - SSH: linux/ssh.md
      - Processes: linux/processes.md
      - Package Management: linux/package-management.md
      - Networking Commands: linux/networking-commands.md

  - 🌐 Networking:
      - Overview: networking/index.md
      - OSI Model: networking/osi.md
      - TCP/IP Model: networking/tcp-ip.md
      - IP Addressing: networking/ip-addressing.md
      - Subnetting: networking/subnetting.md
      - DNS: networking/dns.md
      - HTTP & HTTPS: networking/http.md
      - Common Ports: networking/ports.md
      - Routing: networking/routing.md
      - Switching: networking/switching.md
      - Firewalls: networking/firewalls.md
      - VPN: networking/vpn.md
      - Wireshark: networking/wireshark.md
      - Networking Cheat Sheet: networking/networking-cheat-sheet.md

  - 🐍 Python for Cybersecurity:
      - Coming Soon: python/index.md

  - 🌐 Web Security:
      - Coming Soon: web-security/index.md

  - 🔐 Cryptography:
      - Coming Soon: cryptography/index.md

  - ☁️ Cloud Security:
      - Coming Soon: cloud-security/index.md

  - 🦠 Malware Analysis:
      - Coming Soon: malware-analysis/index.md

  - 🛡️ Digital Forensics:
      - Coming Soon: digital-forensics/index.md

  - 🎯 Interview Questions:
      - Coming Soon: interview-questions/index.md

  - 🤝 Contributing: ../README.md
